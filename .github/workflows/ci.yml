name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint, tipos, tests y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # La compilación no llama a Gemini: la portada sale de la muestra grabada.
      - run: npm run build

  evals:
    name: Evals (Python, sin llamadas al modelo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      # Puntúa las ejecuciones grabadas; falla si algún texto de referencia no tiene la suya.
      - run: uv run nc-evals score --check
