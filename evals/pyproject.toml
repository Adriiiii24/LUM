[project]
name = "nc-evals"
version = "0.1.0"
description = "Banco de evaluación de la extracción de LUM: entidades, relaciones, anclaje y esquema."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "rapidfuzz>=3.10",
]

[project.scripts]
nc-evals = "nc_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
